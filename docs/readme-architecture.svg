<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">Image Upscaling workflow</title><desc id="desc">A notebook-based image enhancement pipeline using the Real-ESRGAN x4plus model with CUDA acceleration when supported.</desc><rect width="1200" height="400" rx="18" fill="#F3F4F1"/>
<text x="56" y="42" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="2.2" fill="#76B900">PROJECT MAP / WORKFLOW</text><text x="56" y="78" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#202722">Image Upscaling</text><text x="56" y="105" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#6D766F">Low-resolution image to enhanced 4× output</text><line x1="56" y1="125" x2="1144" y2="125" stroke="#D6DCD5"/><path d="M 300 237 L 330 237" stroke="#6D766F" stroke-width="1.8" fill="none"/><path d="M 325 232 L 330 237 L 325 242" stroke="#6D766F" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M 584 237 L 614 237" stroke="#6D766F" stroke-width="1.8" fill="none"/><path d="M 609 232 L 614 237 L 609 242" stroke="#6D766F" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M 868 237 L 898 237" stroke="#6D766F" stroke-width="1.8" fill="none"/><path d="M 893 232 L 898 237 L 893 242" stroke="#6D766F" stroke-width="1.8" fill="none" stroke-linejoin="round"/><g><rect x="56" y="158" width="236" height="158" rx="12" fill="#FFFFFF" stroke="#D6DCD5" stroke-width="1.4"/><rect x="56" y="158" width="236" height="5" rx="2.5" fill="#76B900"/><text x="73" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#76B900">01 / INPUT</text><text x="73" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#202722">Image files</text><text x="73" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6D766F">Place images in inputs/.</text></g><g><rect x="340" y="158" width="236" height="158" rx="12" fill="#FFFFFF" stroke="#D6DCD5" stroke-width="1.4"/><rect x="340" y="158" width="236" height="5" rx="2.5" fill="#4F6B52"/><text x="357" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#4F6B52">02 / MODEL</text><text x="357" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#202722">Load x4plus</text><text x="357" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6D766F">Initialise Real-ESRGAN weights.</text></g><g><rect x="624" y="158" width="236" height="158" rx="12" fill="#FFFFFF" stroke="#D6DCD5" stroke-width="1.4"/><rect x="624" y="158" width="236" height="5" rx="2.5" fill="#7A8D83"/><text x="641" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#7A8D83">03 / INFERENCE</text><text x="641" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#202722">Upscale image</text><text x="641" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6D766F">Use GPU when available, otherwise CPU.</text></g><g><rect x="908" y="158" width="236" height="158" rx="12" fill="#FFFFFF" stroke="#D6DCD5" stroke-width="1.4"/><rect x="908" y="158" width="236" height="5" rx="2.5" fill="#76B900"/><text x="925" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#76B900">04 / OUTPUT</text><text x="925" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#202722">Enhanced image</text><text x="925" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6D766F">Write results to outputs/.</text></g><text x="56" y="358" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#76B900">IMPLEMENTATION NOTE</text><text x="56" y="380" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6D766F">Results and speed depend on the input image, model, and available hardware.</text></svg>