<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Upscaling Architecture</title><style>:root{--bg:#F2F3F1;--ink:#28322D;--muted:#707A73;--line:#D9DED8;--card:#FFFFFF;--a:#557F68;font-family:system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;padding:clamp(20px,4vw,56px);background:var(--bg);color:var(--ink)}main{max-width:1200px;margin:auto}.tag{color:var(--a);text-transform:uppercase;letter-spacing:.15em;font-size:.75rem;font-weight:800}h1{font-size:clamp(2rem,5vw,3rem)}p{color:var(--muted);line-height:1.6}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin:36px 0}.stage{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:22px 18px;min-height:200px;text-align:left;cursor:pointer;transition:transform .25s,border-color .25s}.stage:hover,.stage:focus-visible,.stage[aria-pressed=true]{transform:translateY(-5px);border-color:var(--a);outline:none}.stage h2{font-size:1.1rem}.stage p{font-size:.9rem}.detail{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:500px){.grid{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*,*:before{transition:none!important}}</style></head><body><main><div class="tag">Interactive architecture</div><h1>Image Upscaling</h1><p>Increase image resolution with a Python image-upscaling workflow. Select a stage to inspect its role.</p><section class="grid"><button class="stage" type="button" aria-pressed="true" data-i="0"><span class="tag">Stage 1 / INPUT</span><h2>Source image</h2><p>Choose an image to upscale.</p></button><button class="stage" type="button" aria-pressed="false" data-i="1"><span class="tag">Stage 2 / PREPARE</span><h2>Load and validate</h2><p>Check the image and expected format.</p></button><button class="stage" type="button" aria-pressed="false" data-i="2"><span class="tag">Stage 3 / UPSCALE</span><h2>Run model or method</h2><p>Generate a larger image.</p></button><button class="stage" type="button" aria-pressed="false" data-i="3"><span class="tag">Stage 4 / COMPARE</span><h2>Save and inspect</h2><p>Review output size and visible artifacts.</p></button></section><section class="detail" aria-live="polite"><h2 id="heading">Source image</h2><p id="body">Choose an image to upscale.</p></section><p><a href="https://github.com/chyk2468/Image-Upscaling-py" style="color:var(--a)">View repository</a></p></main><script>const stages=[["INPUT","Source image","Choose an image to upscale."],["PREPARE","Load and validate","Check the image and expected format."],["UPSCALE","Run model or method","Generate a larger image."],["COMPARE","Save and inspect","Review output size and visible artifacts."]];document.querySelectorAll('.stage').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.stage').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');document.querySelector('#heading').textContent=stages[+b.dataset.i][1];document.querySelector('#body').textContent=stages[+b.dataset.i][2]}))</script></body></html>
